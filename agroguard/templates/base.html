<!DOCTYPE html>
<html lang="tr" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroGuard AI | Otonom Çiftlik Yönetimi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #121212; color: #e0e0e0; }
        .navbar-brand { font-weight: 700; color: #20c997 !important; }
        .sidebar { min-height: calc(100vh - 70px); border-right: 1px solid #333; }
        .nav-link { color: #aaa; margin-bottom: 5px; border-radius: 5px; }
        .nav-link:hover, .nav-link.active { background-color: #198754; color: #fff; }
        .card { background-color: #1e1e1e; border: 1px solid #333; }
        .time-panel { background-color: #2b2b2b; padding: 10px; border-radius: 8px; border: 1px solid #444; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary sticky-top">
    <div class="container-fluid">
        <a class="navbar-brand" href="/"><i class="bi bi-cpu"></i> AgroGuard AI</a>
        
        <div class="d-flex align-items-center ms-auto time-panel flex-wrap gap-2">
            <span class="text-primary fw-bold"><i class="bi bi-layers"></i> Tarla:</span>
            <select id="simFieldInput" class="form-select form-select-sm bg-dark text-light border-secondary" style="width: 170px;">
                {% for f in data.fields %}
                <option value="{{ f }}" {% if f == data.current_field %}selected{% endif %}>{{ f }}</option>
                {% endfor %}
            </select>

            <span class="text-info fw-bold ms-2"><i class="bi bi-geo-alt"></i> Konum:</span>
            <input type="text" id="simCityInput" class="form-control form-control-sm bg-dark text-light border-secondary" style="width: 110px;" value="{{ data.city }}">
            
            <span class="text-warning fw-bold ms-2"><i class="bi bi-clock-history"></i> Zaman:</span>
            <input type="datetime-local" id="simTimeInput" class="form-control form-control-sm bg-dark text-light border-secondary" style="width: 190px;" value="{{ data.time_str }}">
            
            <button class="btn btn-sm btn-outline-success" onclick="updateSimulationState()">Uygula</button>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 d-none d-md-block sidebar py-4">
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/"><i class="bi bi-grid-1x2"></i> Gösterge Paneli</a></li>
                <li class="nav-item"><a class="nav-link {% if request.path == '/su-kontrol' %}active{% endif %}" href="/su-kontrol"><i class="bi bi-droplet"></i> Su & Don Koruması</a></li>
                <li class="nav-item"><a class="nav-link {% if request.path == '/guc-kontrol' %}active{% endif %}" href="/guc-kontrol"><i class="bi bi-lightning-charge"></i> Enerji Optimizasyonu</a></li>
                <li class="nav-item"><a class="nav-link {% if request.path == '/ajanda' %}active{% endif %}" href="/ajanda"><i class="bi bi-calendar-check"></i> Zirai Ajanda</a></li>
                <!-- YENİ SEKMELER -->
                <li class="nav-item"><a class="nav-link text-info {% if request.path == '/muhasebe' %}active{% endif %}" href="/muhasebe"><i class="bi bi-wallet2"></i> Ön Muhasebe</a></li>
                <li class="nav-item mt-3"><a class="nav-link text-warning {% if request.path == '/oneriler' %}active{% endif %}" href="/oneriler"><i class="bi bi-lightbulb-fill"></i> Tarla Önerileri</a></li>
            </ul>
        </nav>
        <main class="col-md-10 ms-sm-auto col-lg-10 px-md-4 py-4">
            {% block content %}{% endblock %}
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function updateSimulationState() {
        fetch('/api/set-state', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                time: document.getElementById('simTimeInput').value,
                city: document.getElementById('simCityInput').value,
                field: document.getElementById('simFieldInput').value
            })
        }).then(() => location.reload());
    }
</script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
